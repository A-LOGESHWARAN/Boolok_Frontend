<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Boolok AI</title>
    <style>
        /* ── Full-viewport reset ── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            min-height: 100vh;
            overflow-x: hidden;
            background-color: #000000;
        }

        /* Expo mounts inside #root — force it to fill the full browser height */
        #root {
            display: flex;
            flex-direction: column;
            width: 100%;
            min-height: 100vh;
            height: 100%;
        }

        /* Remove any UA default scrollbar gutter colour */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(218, 165, 32, 0.3);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(218, 165, 32, 0.6);
        }
    </style>
</head>

<body>
    <div id="root"></div>
    <%- script %>
</body>

</html>
